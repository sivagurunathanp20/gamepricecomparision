<div class="d-flex align-items-center gap-2 my-3">
  <hr class="flex-grow-1" style="border-color:var(--glass-border);">
  <span class="small text-muted">or</span>
  <hr class="flex-grow-1" style="border-color:var(--glass-border);">
</div>
<a href="{{ url_for('auth.google_login', next=request.args.get('next')) }}"
   class="btn btn-google w-100 d-flex align-items-center justify-content-center gap-2">
  <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true">
    <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
    <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 16 19 12 24 12c3.1 0 5.8 1.2 8 3.1l5.7-5.7C34.2 6.1 29.4 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/>
    <path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.3C29.2 35.1 26.7 36 24 36c-5.3 0-9.7-3.3-11.3-8l-6.5 5C9.6 39.6 16.3 44 24 44z"/>
    <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.1-3.5 5.6-6.7 7.1l.1.1 6.3 5.3C36.8 41.3 44 36 44 24c0-1.3-.1-2.7-.4-3.5z"/>
  </svg>
  {{ google_button_label }}
</a>
{% if not google_oauth_enabled %}
<p class="small text-muted text-center mt-2 mb-0">
  Set <code>GOOGLE_CLIENT_ID</code> and <code>GOOGLE_CLIENT_SECRET</code> in <code>.env</code> to enable this.
</p>
{% endif %}
