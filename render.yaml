services:
  - type: web
    name: game-deals-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: game-deals-db
          property: connectionString

databases:
  - name: game-deals-db
    databaseName: game_deals_db
    user: gamevault_user
    plan: free
